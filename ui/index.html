<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Living Past</title></head>
<body><main class="shell">
<header class="topbar"><div><p class="eyebrow">Living Past</p><h1>The people who knew you</h1></div><span id="status" class="status" role="status">Opening chronicle</span></header>
<div class="chronicle"><aside class="people"><h2>Your chronicle</h2><p class="hint">Choose someone who knew you before your adventure.</p><div id="people"></div><button id="close" class="secondary" type="button">Close</button></aside>
<section class="card"><div id="empty"><h2>A life before Skyrim</h2><p>Choose a person to write the story you share.</p></div><div id="editor" hidden><p class="eyebrow ink">A shared history</p><h2 id="name"></h2><label for="label">Your relationship</label><input id="label" type="text" placeholder="Childhood friend, former mentor…" maxlength="96"><label for="description">Your shared past</label><textarea id="description" rows="12" placeholder="What did you experience together?"></textarea><p id="count" class="hint"></p><details><summary>Need inspiration?</summary><p>How did you meet? What brought you together, and how did you part?</p></details><div class="actions"><button id="apply" type="button">Save and activate</button></div></div><p id="feedback" class="feedback" role="status"></p></section></div>
</main><script type="module" src="/main.ts"></script></body></html>
