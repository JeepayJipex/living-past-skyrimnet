<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Living Past</title></head>
<body><main class="shell">
<header class="topbar"><div><p class="eyebrow">Living Past</p><h1>A life before the adventure</h1></div><span id="status" class="status">Connecting</span></header>
<section class="card"><h2>Ysolda · Technical validation</h2>
<p id="relationship-index" class="hint" role="status">Loading relationship index.</p>
<button id="load-narrative" class="secondary" type="button" disabled>Load saved narrative</button>
<label for="description">Your shared past</label>
<textarea id="description" rows="5" placeholder="Ysolda and the player grew up together in Whiterun. They have been friends since childhood."></textarea>
<button id="replace-draft" class="secondary" type="button" hidden>Clear draft for replacement</button>
<details>
  <summary>Exact text for line-ending tests</summary>
  <label for="exact-text">Draft as a JSON string</label>
  <input id="exact-text" type="text" spellcheck="false">
  <button id="load-exact-text" class="secondary" type="button">Load exact draft</button>
</details>
<p id="count" class="hint"></p><div class="actions"><button id="apply" disabled>Stage, verify and activate</button><button id="close" class="close-button" disabled>Close</button></div>
<details>
  <summary>Developer diagnostics</summary>
  <p id="load-metrics" class="hint" role="status"></p>
  <p id="diagnostic" class="hint" role="status">Storage diagnostic pending.</p>
  <button id="refresh-diagnostic" class="secondary">Refresh diagnostic</button>
</details>
<p id="feedback" class="feedback" role="status">Connecting to the game.</p><p class="hint">Use your configured hotkey or Escape to close.</p>
</section></main><script type="module" src="/main.ts"></script></body></html>
